[package]
name = "nxkit-rt"
description = "The nxkit runtime for the host, a static library with a C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L1"
in_v = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
nxb-model = { workspace = true }
nxkit-abi = { workspace = true }
nxkit-hos = { workspace = true }
nxkit-nvn = { workspace = true }
nxkit-svc-fs = { workspace = true }
nxkit-svc-offline = { workspace = true }
nxkit-svc-input = { workspace = true }
nxkit-svc-video = { workspace = true }

[dev-dependencies]
nxtitle = { workspace = true }

# Not `workspace = true`: with `nxb-sys`, this is the one crate allowed to use `unsafe`. It is the C ABI seam of the host.
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
