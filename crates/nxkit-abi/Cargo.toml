[package]
name = "nxkit-abi"
description = "The shared contract of the nxkit host: guest memory access, exported guest functions and the IPC service trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]

# Not `workspace = true`: `unsafe` is denied for the crate and allowed in one module, `guest`, which reads and writes
# guest memory through raw host addresses.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
