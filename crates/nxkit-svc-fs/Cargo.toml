[package]
name = "nxkit-svc-fs"
description = "The fs service of nxkit: fsp-srv over IPC and the nn::fs functions at SDK level, with the romfs mapped and the saves in the nxnative layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

# Not `workspace = true`: `unsafe` is denied for the crate and allowed in one module, `sys`, which maps files and
# calls the clone, swap and attribute functions of the system.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
