[package]
name = "nxkit-ipc"
description = "The IPC server of the nxkit host: HIPC and CMIF, domains, the service manager and per-command counters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

# Not `workspace = true`: the crate forbids `unsafe` and the guest memory is read through `nxkit-abi`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
