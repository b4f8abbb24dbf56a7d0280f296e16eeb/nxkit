[package]
name = "nxkit-svc-audio"
description = "The audio service of the nxkit host: audren:u with a renderer that mixes in the output callback, audout:u and IAudioDevice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

[target.'cfg(all(target_vendor = "apple", not(target_os = "ios")))'.dependencies]
objc2-audio-toolbox = { workspace = true, features = [
    "std",
    "objc2",
    "objc2-core-audio",
    "objc2-core-audio-types",
    "AudioComponent",
    "AUComponent",
    "AudioOutputUnit",
] }
objc2-core-audio = { workspace = true, features = ["std", "objc2", "objc2-core-audio-types", "AudioHardware"] }
objc2-core-audio-types = { workspace = true, features = ["std", "objc2", "CoreAudioBaseTypes"] }

# Not `workspace = true`: `unsafe` is denied for the crate and allowed in one module, `sys`, which holds the macOS FFI and the
# lock-free queues.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-audio-toolbox = { workspace = true, features = ["std", "objc2-core-audio-types", "AudioComponent", "AUComponent", "AudioOutputUnit"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
objc2-avf-audio = { workspace = true, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSString", "NSDictionary", "NSNotification", "NSOperation", "block2"] }
block2 = { workspace = true, features = ["std"] }
