[package]
name = "nxkit-svc-video"
description = "The video service of the nxkit host: the movie decoder of the Switch SDK on VideoToolbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { workspace = true, features = ["std", "objc2", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { workspace = true, features = ["std", "objc2", "objc2-metal", "CVBase", "CVBuffer", "CVImageBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBuffer", "CVReturn"] }
# The default features are the Metal headers, as in `nxkit-metal`.
objc2-metal = { workspace = true, features = ["default"] }
# The software AV1 decoder, a Rust port of dav1d (BSD-2-Clause), for a Mac without an AV1 decoder in hardware. It builds with
# cargo alone. The feature `asm` stays off: the crate on crates.io leaves out `asm-offsets.h`, so its assembly does not
# build, and the x86-64 assembly needs `nasm`.
rav1d = { workspace = true, features = ["bitdepth_8", "bitdepth_16"] }
objc2-video-toolbox = { workspace = true, features = ["std", "objc2-core-media", "objc2-core-video", "VTBase", "VTDecompressionSession", "VTErrors", "VTUtilities"] }

# Not `workspace = true`: this crate holds the `unsafe` calls into VideoToolbox and into guest functions. Other crates
# see a safe API.
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
