[package]
name = "nxb-sys"
description = "Platform services; the only crate with unsafe code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]

# Windows has no system zlib: build it from source and link it statically.
[target.'cfg(windows)'.dependencies]
libz-sys = { version = "1", default-features = false, features = ["static"] }

# Not `workspace = true`: this is the one crate allowed to use `unsafe` (workspace-layout rule 5).
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
