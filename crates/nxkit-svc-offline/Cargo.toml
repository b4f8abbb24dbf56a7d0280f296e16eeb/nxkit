[package]
name = "nxkit-svc-offline"
description = "The offline service of nxkit: what the game gets for networking and peripherals it cannot use here"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

# Not `workspace = true`: `unsafe` is denied for the crate and allowed in one module, `sys`, whose functions write
# through the pointers the game passes.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
