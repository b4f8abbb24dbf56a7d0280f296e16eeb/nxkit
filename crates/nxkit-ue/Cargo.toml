[package]
name = "nxkit-ue"
description = "The Unreal Engine take-overs of the nxkit host: the engine heap in an arena of the guest block and the size of the engine region"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "R2"
in_v = false

[dependencies]
nxkit-abi = { workspace = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
