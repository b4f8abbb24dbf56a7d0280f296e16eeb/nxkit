[package]
name = "nxkit-metal"
description = "The Metal 4 backend of the nxkit host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L0"
in_v = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, features = ["std"] }
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFDate"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSError", "NSRunLoop", "NSString", "NSURL"] }
# The default features are the Metal headers. Metal 4 (`MTL4*`) is part of them.
objc2-metal = { workspace = true, features = ["default"] }
objc2-quartz-core = { workspace = true, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "CAFrameRateRange", "objc2-metal", "objc2-core-foundation"] }

# Not `workspace = true`: this crate holds the `unsafe` calls into Metal. Other crates see a safe API.
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
