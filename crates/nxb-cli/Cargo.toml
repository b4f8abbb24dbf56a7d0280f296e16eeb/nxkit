[package]
name = "nxb-cli"
description = "The nxb binary: the nxkit app build and the stage commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L3"
in_v = false

[[bin]]
name = "nxb"
path = "src/bin/nxb.rs"

[dependencies]
nxb-model.workspace = true
nxb-error.workspace = true
nxb-obs.workspace = true
nxb-stages.workspace = true
nxb-build.workspace = true
nxb-sched.workspace = true
nxb-extract.workspace = true
nxb-tool.workspace = true
nxb-store.workspace = true
nxb-pack.workspace = true
nxb-archive.workspace = true
nxb-pyjson.workspace = true
# The own front end command line (layer F, a member of this workspace): optional, see deps.toml.
airc = { path = "../airc", optional = true }

[features]
default = ["air-front"]
air-front = ["nxb-stages/air-front", "dep:airc"]

[lints]
workspace = true
