[rav1d]
reason = "the software AV1 decoder of nxkit-svc-video: VideoToolbox decodes AV1 in hardware only (Apple M3 and A17 Pro on), so an M1 or M2 Mac has no AV1 decoder. Ocarina of Time on Switch 2 plays its movies as AV1. rav1d is the Rust port of dav1d by the Prossimo project (ISRG). It builds with cargo and the clang of Xcode: no system library, no pkg-config, no meson, no nasm on Apple silicon. The choices that were not taken: the `dav1d` and `dav1d-sys` crates need a libdav1d from the system, or meson, ninja and nasm for their `build` feature, and a vendored C source would need a build script that runs a C toolchain with a pinned source download"
source = "GitHub, the tag v1.1.0 pinned at commit 782dab2135ea64a057c097088a13eb8ed3cc3320. Default features off, features asm, asm_arm64_dotprod and asm_arm64_i8mm on. The crates.io package 1.1.0 leaves out `src/arm/asm-offsets.h`, so its ARM assembly does not build; the tag has it. The assembly is built by rav1d's build script with `cc` and the clang of Xcode, which nxkit needs anyway for the Metal tools. Without it the decoder ran without its NEON code and could not decode a 1080p movie at 60 fps on an M2. The packages that it brings (all at the versions of Cargo.lock): assert_matches, atomig, atomig-macro, bitflags, byteorder, cc, cfg-if, libc, lock_api, nasm-rs (build script, used only for x86-64 assembly), parking_lot, parking_lot_core, paste, raw-cpuid, strum, strum_macros, to_method, zerocopy 0.7 and zerocopy-derive 0.7"
licence = "BSD-2-Clause (rav1d and dav1d). The helper packages are MIT or Apache-2.0 or MIT OR Apache-2.0"
version = "1.1.0"
unsafe = "many: it is a c2rust port with a C interface, and its decode loops use unsafe code for speed. nxkit-svc-video calls it only from its module sys/dav1d.rs, with the C interface (`dav1d_open`, `dav1d_send_data`, `dav1d_get_picture`). It reads the input of a game, so a corrupt packet must not crash it: the tests send truncated and flipped packets. A panic inside its `extern \"C\"` functions would stop the process, which is an open point"
owner = "project team"
used_by = ["nxkit-svc-video"]

