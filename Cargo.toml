[profile.test]
# the parser tests recurse deeply: optimise them as the front-end project did
opt-level = 1

# The software AV1 decoder is too slow at the default level of a debug build for a movie at 30 fps.
[profile.dev.package.rav1d]
opt-level = 3

[profile.release]
debug = "line-tables-only"
