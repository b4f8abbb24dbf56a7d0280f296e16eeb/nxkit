[profile.test]
debug = "line-tables-only"

# The parser recurses deeply. At opt-level 0 its recursion-limit test overflows the default 2 MiB test thread stack.
[profile.test.package.msl-parse]
opt-level = 1

# The software AV1 decoder is too slow at the default level of a debug build for a movie at 30 fps.
[profile.dev.package.rav1d]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# The published binary (release.yml): fat LTO makes nxb about a fifth smaller (14.7 to 11.6 MB) but links for about
# two minutes, so day-to-day release builds keep the plain release profile.
[profile.dist]
inherits = "release"
lto = "fat"
