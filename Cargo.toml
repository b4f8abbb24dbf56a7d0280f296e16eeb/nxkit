[workspace]
resolver = "3"
members = ["crates/*", "titles/nxtitle", "titles/nxtitles", "titles/families/*", "titles/games/*", "xtask"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
nxb-model = { path = "crates/nxb-model" }
nxkit-abi = { path = "crates/nxkit-abi" }
nxkit-hos = { path = "crates/nxkit-hos" }
nxkit-nvn = { path = "crates/nxkit-nvn" }
