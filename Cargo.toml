[workspace]
resolver = "3"
members = ["crates/*", "titles/nxtitle", "titles/nxtitles", "titles/engines/*", "titles/graphics/*", "titles/games/*", "xtask"]

[workspace.package]
version = "0.15.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

