# nxb rewrite rules of Super Mario Bros. Wonder (Switch). Private data: instruction words of SDK code.
#
# The build row of update 1.2.1 (v327680) and the engine's two SDK-wide rules for the `sdk` module. The game has no
# code patch of its own: the engine tree has no patches.py for it, and its README says "No game-specific executable
# cuts". The README says that the SDK-wide rules cut the game's sdk builds (3053b229 v0, e4bd58ca 1.2.1): the node area
# and the 2 MB alignment of large regions. Its 5 GB guest layout (a 2.875 GB alias region for 1.75 GB of virtual
# address memory) was measured with them. Without them the AddressRegionManager keeps a 1 GB node area at the start of
# the alias region and a region of 1 GB or more is aligned to 1 GB.
#
# The rules are those of `MATCH_CUTS['sdk']` in sdk_patches.py, the implementation of SDK 15.3.2 to 18.3.5 (`node`
# 240 bytes, `align` 388 bytes), with the fingerprints the engine lists. Both match sdk build
# e4bd58cac28cf13a08fb417aa013cdcb once (checked 2026-11-12 with nxb-rewrite on the extracted v327680: node at
# sdk+0x134778 and +0x13480c, align at sdk+0x134964, +0x13496c and +0x134970).

scope = "010015100B514000"

[[build]]
row = ["build", "v327680", "1.2.1", "main=ff773e90972d544eb79406eaa65396d5", "sdk=e4bd58cac28cf13a08fb417aa013cdcb"]

[[rule]]
binding = "sdk"
kind = "match"
module = "sdk"
name = "AddressRegionManager node area 1 GB → 62 MB"
multi = false
evidence = "engine tree dm/tools/sdk_patches.py and dm/games/010015100B514000/README.md at b91cb749, read 2026-11-12"

