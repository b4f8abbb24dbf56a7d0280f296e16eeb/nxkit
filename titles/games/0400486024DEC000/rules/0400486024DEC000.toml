# nxb rewrite rules of The Legend of Zelda: Ocarina of Time (Switch 2). Private data: instruction words of game code.
#
# The frame ratio stub of `MATCH_FRAME_STEP` in patches.py, as steps for main build e0f3ccfaf50065ae4ea01eb5aeb13b1a
# (v131072). The function is at main+0x6e6be0, the division `fdiv s8,s1,s0` at +0xe4 (main+0x6e6cc4). The stub
# gives the ratio the host's step × base rate / 60, where the step is in vsyncs of 1/60 s. Which field carries the
# step depends on the host's mode:
#  - At fps_target 30 and 60 the host writes the whole step in vsyncs (state page +0x20, 60 Hz units) and leaves the
#    variable step (+0x50) at 0. The stub counts the vsyncs stepped (state page +0x30).
#  - At fps_target 120 the host steps by time: +0x50 is the time since the previous frame in units of 1/30 s (0.25 at
#    120 fps, floor 0.125, ceiling 1.5) and +0x20 is 1. A variable step that is not 0 wins, and as vsyncs it is
#    twice its value, so the ratio is half per 120 Hz tick. The stepped count is not kept (it is a whole count and
#    only the load-driven step at 60 reads it).
# Until the host has decided a step (+0x50 and +0x20 are both 0), and at fps_target 0 (+0x0), the game's own division
# runs. Offsets in the comments are from label 0, the start of the stub.
#
# The dynamic resolution stub of the same patches.py is not here: the resolution rules are a separate change.

scope = "0400486024DEC000"

[[build]]
row = ["build", "v131072", "v131072", "main=e0f3ccfaf50065ae4ea01eb5aeb13b1a", "subsdk0=b0110087a7b339ef74588d3bd0b4dd5d", "sdk=1643a838814f9c10c696f930ed681e7f"]

