# nxb rewrite rules of Hyrule Warriors: Age of Calamity (Switch). Private data: instruction words of game and SDK code.
#
# Made from the engine tree at 034e91a8 (read 2026-11-12): the build row of v327680 and the engine's SDK-wide rules for
# the `sdk` module (12 implementations of the node area of 62 MB and of the 2 MB alignment of large regions).
#
# The SDK-wide rules are the engine's `MATCH_CUTS['sdk']`: each rule has one implementation per reviewed SDK, and a rule
# cuts only when exactly one implementation matches. The engine gives them to every game's sdk build that has no byte
# cuts of its own, and the engine measured the memory layout of the game with them. Which implementation matches this
# game's sdk build was not checked here. The rewriter logs a rule it skips.
#
# Left out: the frame step stubs of `main` (`FRAME_STEP` and `MATCH_FRAME_STEP`): a stub is a list of steps, not a byte
# cut, and no rule of this module describes it.

