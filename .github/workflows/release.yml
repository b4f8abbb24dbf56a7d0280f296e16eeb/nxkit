name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tree
        run: tools/no-game-data.sh

      - name: Build
        # nxkit-host uses Metal 4, so the release asks for macOS 26. tools/release-package.sh checks the value in both binaries.
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: cargo build --profile dist --locked -p nxb-cli -p nxkit-host

      - name: Pack, sign and write the notes
        run: PROFILE=dist tools/release-package.sh "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "dist/nxb-${GITHUB_REF_NAME}-macos-arm64.zip" dist/SHA256SUMS
          --title "nxkit ${GITHUB_REF_NAME}" --notes-file dist/notes.md
